# A fallback deploy of the API to Railway from main, after ci has passed.
#
# The api service is connected to this repository through Railway's GitHub
# integration and deploys every push to main by itself; that is the normal
# path and needs nothing here. This workflow is the same `railway up` a
# developer runs, for when that integration is disconnected. It needs one
# secret, and until it exists the job skips itself and says so:
#
#   RAILWAY_TOKEN  a Project Token for tapp-platform / production
#                  (Railway -> project -> Settings -> Tokens), stored as a
#                  GitHub Actions secret on this repository.
name: deploy-api

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  railway:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Is the deploy token configured?
        id: token
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN is not set on this repository; skipping the deploy." >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.configured == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Did this commit touch the API?
        id: changed
        if: steps.token.outputs.configured == 'true'
        run: |
          if git diff --quiet ${{ github.event.workflow_run.head_sha }}~1 ${{ github.event.workflow_run.head_sha }} -- apps/api; then
            echo "api unchanged in this commit; nothing to deploy." >> "$GITHUB_STEP_SUMMARY"
            echo "yes=false" >> "$GITHUB_OUTPUT"
          else
            echo "yes=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.token.outputs.configured == 'true' && steps.changed.outputs.yes == 'true'
        with:
          node-version: 24
      - run: npm install -g @railway/cli
        if: steps.token.outputs.configured == 'true' && steps.changed.outputs.yes == 'true'

      - name: railway up
        if: steps.token.outputs.configured == 'true' && steps.changed.outputs.yes == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service api --ci
